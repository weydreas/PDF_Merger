name: PDF Merger regression tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  linux-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q pdf_merger.py ai_renamer.py document_router.py dependency_check.py tests
      - name: Unit tests (no external API calls)
        run: python -m unittest discover -s tests -v

  windows-ui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q pdf_merger.py ai_renamer.py document_router.py dependency_check.py tests
      - name: Unit + PowerShell 5.1 interaction tests
        run: python -m unittest discover -s tests -v
